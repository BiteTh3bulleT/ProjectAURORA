name: Build Cassette Walkman

on:
  push:
    branches:
      - build/cassette-walkman-0.1.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassette-walkman
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle clean build --stacktrace --warning-mode all

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cassette-walkman-mc26.2
          path: |
            cassette-walkman/build/libs/*.jar
            !cassette-walkman/build/libs/*-sources.jar
          if-no-files-found: error
